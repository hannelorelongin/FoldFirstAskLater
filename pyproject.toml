[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel>=0.37.1"]

[project]
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
name = "foldfirst"
version = "0.1.0" # change VERSION too
description = "Fold First Ask Later: structure-informed function annotation of phage proteins"
readme = "README.md"
requires-python = ">=3.8, <4"
license = {file = "MIT"}
authors = [
    {name = "Hannelore Longin"}
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

dependencies = [
        "click >=8.0.0",
        "loguru >=0.5.3",
        "pyyaml >=6.0",
        "pandas >=1.4.2",
        "biopython >=1.80",
        "datasets >=2.15",
        "requests >=2.25",
        "sentencepiece >=0.1.99",
        "protobuf >=6.0",
        "transformers >=4.34",
        "torch >=2.1.2",
        "pyrodigal-gv >=0.3.1",
        "pyarrow >=14.0.0",
        "alive-progress >=3.0.1",
        "numpy >=1.20,<2",
        "pycirclize >=0.3.1",
        "h5py >=3.5",
        "tqdm >=4.35.0",
    ]

[project.scripts]
foldfirst = 'foldfirst:main'

[project.urls]
"Homepage" = "https://github.com/hannelorelongin/FoldFirstAskLater"


[project.optional-dependencies]
lint = [
    "isort",
    "black"
]
test = ["pytest>=6.2.5",
"pytest-cov >=3.0.0"]
exe = [
    "setuptools",
    "wheel",
    "build",
]

[tool.setuptools]
include-package-data = true
zip-safe = true  # This just means it's safe to zip up the bdist

[tool.setuptools.package-data]
foldfirst = ["features/autotune_data/*.fasta"]

